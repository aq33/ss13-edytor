<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edytor map SS13</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<canvas id="plotno"></canvas>

<div id="gora" class="panel">
  <span class="tytul">Edytor map</span>
  <button id="b-otworz" title="Otwórz mapę">Otwórz</button>
  <button id="b-zapisz" title="Zapisz (Ctrl+S)">Zapisz</button>
  <span class="sep"></span>
  <button id="b-cofnij" title="Cofnij (Ctrl+Z)">↶</button>
  <button id="b-ponow" title="Ponów (Ctrl+Y)">↷</button>
  <span class="sep"></span>
  <span id="poziomy"></span>
  <span class="sep"></span>
  <span id="nazwa-mapy" class="przygaszone">nie wczytano mapy</span>
  <span style="flex:1"></span>
  <button id="b-samouczek" title="Pokaż albo schowaj samouczek">Samouczek</button>
</div>

<div id="samouczek" class="panel ukryty"></div>

<div id="warstwy" class="panel">
  <div class="naglowek">Widok</div>
  <label><input type="checkbox" data-w="podloze" checked> Podłoże</label>
  <label><input type="checkbox" data-w="obiekty" checked> Obiekty</label>
  <label><input type="checkbox" data-w="dekale" checked> Dekale</label>
  <label><input type="checkbox" data-w="rury" checked> Rury</label>
  <label><input type="checkbox" data-w="kable" checked> Kable</label>
  <label><input type="checkbox" data-w="pomocnicze" checked> Pomocnicze</label>
  <label><input type="checkbox" data-w="obszary"> Obszary</label>
  <label><input type="checkbox" id="w-siatka"> Siatka</label>
</div>

<div id="architekt" class="ukryty">
  <div id="kategorie" class="panel"></div>
  <div id="siatka-panel" class="panel ukryty">
    <div class="pasek">
      <span id="kat-nazwa" class="naglowek"></span>
      <input id="szukaj" type="search" placeholder="Szukaj…" autocomplete="off">
      <label class="przygaszone"><input type="checkbox" id="wszystkie"> wszystkie</label>
    </div>
    <div id="podgrupy"></div>
    <div id="przyciski"></div>
  </div>
</div>

<div id="inspekcja" class="panel ukryty"></div>
<div id="info" class="panel ukryty"></div>
<div id="podpowiedz" class="ukryty"></div>

<div id="dol" class="panel">
  <button id="b-architekt" class="duzy">Architekt</button>
  <button id="b-pokoj" class="duzy" title="Pokój (R): ściany dookoła, podłoga w środku">Pokój</button>
  <button id="b-rozbiorka" class="duzy" title="Rozbiórka (X), z Shiftem usuwa wszystko do kosmosu">Rozbiórka</button>
  <button id="b-podloga" class="duzy" title="Usuń podłogę (F): podłoga zamienia się w kosmos">Usuń podłogę</button>
  <button id="b-przenies" class="duzy" title="Przenieś (M): zaznacz, potem kliknij w nowe miejsce">Przenieś</button>
  <button id="b-wskaz" class="duzy" title="Inspekcja (Esc)">Inspekcja</button>
  <span class="sep"></span>
  <button id="b-kopiuj" title="Kopiuj prostokąt (C)">Kopiuj</button>
  <button id="b-wklej" title="Wklej schowek (V)" disabled>Wklej</button>
  <button id="b-zapisz-szablon" title="Zapisz schowek jako szablon" disabled>Zapisz jako szablon</button>
  <span class="sep"></span>
  <span class="przygaszone skroty">LPM stawia · PPM anuluje · Q/E obrót · WASD przesuwa · kółko przybliża</span>
</div>

<div id="okno-map" class="okno ukryty">
  <div class="panel okno-tresc">
    <div class="pasek"><span class="naglowek">Otwórz mapę</span><input id="szukaj-mapy" type="search" placeholder="Filtruj…" autocomplete="off"><button id="zamknij-mapy">✕</button></div>
    <div id="lista-map"></div>
  </div>
</div>

<div id="ladowanie" class="okno ukryty"><div class="panel okno-tresc"><span id="ladowanie-tekst">Wczytywanie…</span></div></div>
<div id="komunikat" class="ukryty"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
